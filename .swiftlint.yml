# SwiftLint 配置文件 for Aether 项目
# 详见: https://github.com/realm/SwiftLint

# 检查的目录
included:
  - Aether
  - AetherTests
  - AetherUITests

# 排除的目录
excluded:
  - Pods
  - DerivedData
  - .build
  - Aether.xcodeproj

# 启用的 opt-in 规则（默认规则集之外需显式开启）
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - empty_string
  - explicit_init

# 禁用的规则（与 SwiftUI 项目不兼容）
disabled_rules:
  - trailing_newline
  - leading_whitespace
  - todo
  - identifier_name
  - type_name
  - file_header
  - private_over_fileprivate
  - switch_case_on_newline  # SwiftUI 项目中 case 同行是常见风格

# 规则参数配置

# 禁止 as!
force_cast:
  severity: warning

# 禁止强制解包 !
force_unwrapping:
  severity: warning

# 隐式解包可选类型
implicitly_unwrapped_optional:
  severity: warning

# 禁止 try!
force_try:
  severity: warning

# 行长度
line_length:
  warning: 200
  error: 300

# 函数体长度（主流程编排函数天然较长）
function_body_length:
  warning: 150
  error: 300

# 类型体长度（ChatViewModel 作为核心 VM 包含多个职责）
type_body_length:
  warning: 500
  error: 800

# 文件长度
file_length:
  warning: 800
  error: 1500

# 圈复杂度（含 UITest 短路 / RAG / 缓存 / ReAct 循环的主流程）
cyclomatic_complexity:
  warning: 20
  error: 40

# 嵌套深度
nesting:
  type_level: 3

# 元组大小
large_tuple:
  warning: 4

# 参数数量
function_parameter_count:
  warning: 6
  error: 8

# 行尾空格
trailing_whitespace:
  severity: warning

# 垂直空行
vertical_whitespace:
  severity: warning
  max_empty_lines: 2

# 空集合用 isEmpty
empty_count:
  severity: warning

# 空字符串用 isEmpty
empty_string:
  severity: warning

# 冒号规范
colon:
  severity: warning

# 逗号规范
comma:
  severity: warning

# 显式 init
explicit_init:
  severity: warning

# 自定义规则: 无
custom_rules: {}
