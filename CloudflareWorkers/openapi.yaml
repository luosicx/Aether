openapi: 3.0.3
info:
  title: Aether BFF API
  version: 1.0.0
  description: |
    Aether 跨平台业务网关 BFF API 契约。

    本文件是 BFF 线协议的**唯一契约源**：Worker 路由与三端客户端 DTO 均需与之一致，
    `test/contract.test.js` 会在 CI 中校验路由、响应 envelope 与客户端字段是否漂移。
    每个 operation 的 `operationId` 必须与 `worker.js` 中 `dispatch` 的 handler id 完全相同。

    所有受保护端点需在请求头携带 `X-BFF-Token`，由 Cloudflare Worker 校验 KV `bff_tokens` 合法性。

    ## 鉴权
    - Header: `X-BFF-Token: <token>`
    - 缺失/无效返回 401

    ## 限流
    - chat 端点每 userId 每分钟 60 次，超额返回 429 + `Retry-After` 头
    - 其余业务端点每 userId 每分钟 600 次

    ## 响应约定
    - 单资源使用 envelope：`{ "conversation": {...} }`、`{ "memory": {...} }`、`{ "summary": {...} }`
    - 列表使用 envelope：`{ "conversations": [...] }`、`{ "messages": [...] }`、`{ "memories": [...] }`、`{ "chunks": [...] }`
    - 删除统一返回 `{ "deleted": true, "id": "<资源 id>" }`
    - 错误统一返回 `{ "error": "<消息>" }`

    ## SSE 流式格式
    - `data: {"type":"delta","content":"xxx"}\n\n`
    - `data: {"type":"done","conversationId":"...","messageId":"...","userMessageId":"..."}\n\n`
    - `data: {"type":"error","message":"..."}\n\n`
    - `data: [DONE]\n\n`

    ## 向后兼容
    - POST 到 `/v1/chat/completions` 或 `/v1/embeddings` 走 LLM 透传代理，按 `X-Provider` 路由到
      DeepSeek / Qwen 并注入上游 Authorization；校验 token 过期时间、model 白名单与 1 MiB 请求体上限。
      其余路径返回 404，避免 BFF 成为开放代理。

servers:
  - url: https://aether-bff.<your-subdomain>.workers.dev
    description: Cloudflare Workers 部署地址

security:
  - BFFToken: []

components:
  securitySchemes:
    BFFToken:
      type: apiKey
      in: header
      name: X-BFF-Token
      description: BFF Token，由 Cloudflare KV `bff_tokens` 校验

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        parent_id:
          type: string
          nullable: true
        created_at:
          type: integer
          description: 毫秒时间戳
        updated_at:
          type: integer
          description: 毫秒时间戳
        last_message_preview:
          type: string
          nullable: true
        is_pinned:
          type: integer
          description: 0 / 1
        system_prompt:
          type: string
        unread_count:
          type: integer
        order_field:
          type: integer

    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        tool_calls:
          type: string
          nullable: true
          description: JSON 字符串
        tool_call_id:
          type: string
          nullable: true
        tool_name:
          type: string
          nullable: true
        feedback:
          type: integer
          nullable: true
          description: 1=点赞, -1=点踩, null=未反馈
        created_at:
          type: integer
          description: 毫秒时间戳

    Memory:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        content:
          type: string
        category:
          type: string
          nullable: true
        importance:
          type: number
          default: 0.5
        embedding:
          type: string
          nullable: true
          description: JSON 数组，向量检索用
        source_conversation_id:
          type: string
          nullable: true
        created_at:
          type: integer
          description: 毫秒时间戳

    DocumentChunk:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        content:
          type: string
        metadata:
          type: string
          nullable: true
        chunk_index:
          type: integer
        weight:
          type: number
          default: 1.0
        created_at:
          type: integer
          description: 毫秒时间戳；关键词检索路径未 SELECT 该列，客户端需容忍缺省
        document_title:
          type: string
          nullable: true

    HealthSummary:
      type: object
      properties:
        user_id:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        steps:
          type: integer
          nullable: true
        sleep_hours:
          type: number
          nullable: true
        resting_heart_rate:
          type: integer
          nullable: true

    DeletedResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        conversationId:
          type: string
          nullable: true
          description: 为空时自动创建新会话
        model:
          type: string
          default: deepseek-chat
        provider:
          type: string
          enum: [deepseek, qwen]
          default: deepseek
        memoryEnabled:
          type: boolean
          default: true
        temperature:
          type: number
        maxTokens:
          type: integer
        systemPrompt:
          type: string

    ChatSSEEvent:
      type: object
      properties:
        type:
          type: string
          enum: [delta, done, error]
        content:
          type: string
          description: delta 事件的增量文本
        conversationId:
          type: string
          description: done 事件携带
        messageId:
          type: string
          description: done 事件携带，助手消息 id
        userMessageId:
          type: string
          description: done 事件携带，用户消息 id
        message:
          type: string
          description: error 事件携带

  responses:
    BadRequest:
      description: 请求体或参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未鉴权（X-BFF-Token 缺失或无效）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 限流
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 服务未配置（如 D1 未绑定）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /chat/stream:
    post:
      operationId: chat.stream
      summary: 流式聊天
      description: 加载会话上下文 + 历史 + 记忆 + RAG，调用 LLM 流式返回 SSE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE 流式响应
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSSEEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations:
    get:
      operationId: conversations.list
      summary: 列出会话
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: pinned
          in: query
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: conversations.create
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                systemPrompt:
                  type: string
                parentId:
                  type: string
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{id}:
    get:
      operationId: conversations.get
      summary: 获取单个会话
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: conversations.update
      summary: 更新会话
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                isPinned:
                  type: integer
                systemPrompt:
                  type: string
                orderField:
                  type: integer
      responses:
        '200':
          description: 更新后的会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: conversations.delete
      summary: 删除会话（级联删除其下消息）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /conversations/{conversationId}/messages:
    get:
      operationId: messages.list
      summary: 列出某会话下的消息
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}:
    delete:
      operationId: messages.delete
      summary: 删除单条消息
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/feedback:
    post:
      operationId: messages.feedback
      summary: 对消息反馈
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: integer
                  enum: [1, -1, 0]
                  description: 1=点赞, -1=点踩, 0=取消
      responses:
        '200':
          description: 反馈成功
          content:
            application/json:
              schema:
                type: object
                required: [id, feedback]
                properties:
                  id:
                    type: string
                  feedback:
                    type: integer
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory:
    get:
      operationId: memory.list
      summary: 列出记忆
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 记忆列表
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: memory.create
      summary: 创建记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                category:
                  type: string
                importance:
                  type: number
                sourceConversationId:
                  type: string
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory:
                    $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/search:
    post:
      operationId: memory.search
      summary: 搜索记忆（文本匹配）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 5
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                required: [memories, query]
                properties:
                  memories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
                  query:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/{id}:
    delete:
      operationId: memory.delete
      summary: 删除记忆
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /rag/search:
    post:
      operationId: rag.search
      summary: 检索文档分块
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 3
      responses:
        '200':
          description: 检索结果
          content:
            application/json:
              schema:
                type: object
                required: [chunks, query]
                properties:
                  chunks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentChunk'
                  query:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /rag/documents:
    post:
      operationId: rag.upload
      summary: 上传文档（含分块）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                title:
                  type: string
                content:
                  type: string
                source:
                  type: string
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                required: [documentId, chunkCount]
                properties:
                  documentId:
                    type: string
                  chunkCount:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /health/summary:
    post:
      operationId: health.upload
      summary: 上报健康摘要（按 user_id + date upsert）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  description: YYYY-MM-DD
                steps:
                  type: integer
                sleepHours:
                  type: number
                restingHeartRate:
                  type: integer
      responses:
        '200':
          description: 上报成功，返回写入后的摘要
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    $ref: '#/components/schemas/HealthSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /health/summary/{date}:
    get:
      operationId: health.get
      summary: 获取某日健康摘要
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            description: YYYY-MM-DD
      responses:
        '200':
          description: 健康摘要
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    $ref: '#/components/schemas/HealthSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
