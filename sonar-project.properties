# SonarCloud 项目配置

sonar.projectKey=luosicx_Aether
sonar.organization=luosicx
sonar.projectName=Aether

# 源码与测试目录
# 包含 Rust 核心（rust/aether-core/src）与 AetherSDK（Packages/AetherCore/Sources/AetherSDK），
# 使 SonarCloud 统计 Rust 代码与 AetherSDK 的覆盖率
sonar.sources=Aether,rust/aether-core/src,Packages/AetherCore/Sources/AetherSDK
sonar.tests=AetherTests,AetherUITests,Packages/AetherCore/Tests/AetherSDKTests

# 排除纯 SwiftUI 视图、设计令牌、App 入口、协议定义、Actor 占位和 AetherWatch
# AetherUITests 不参与覆盖率统计（0% 覆盖的 UI 测试代码）
# App 入口已拆分为 AetherApp+Shared/iOS/macOS，用通配符排除
sonar.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp*.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**

# 覆盖率排除同上
# macOS-only 工具（TerminalCommandTool/SafariControlTool/FileOperationTool/WindowManagementTool）
# 不再排除：CI 合并 iOS + macOS coverage.xml，macOS coverage 包含这些文件的覆盖数据
# OnDevice/: MLXInferenceEngine/OnDeviceModelDownloader 需 ML 运行时，iOS 模拟器无法测试
sonar.coverage.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp*.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**,**/OnDevice/**

# 覆盖率报告路径（CI 中由 xccov view --report 解析生成 SonarCloud Generic Coverage XML）
# 路径相对于项目根目录（如 Aether/Services/MyService.swift）
sonar.coverageReportPaths=coverage-report/coverage.xml

# 编码
sonar.sourceEncoding=UTF-8

# 忽略特定规则误报（NOSONAR 行内注释对 S1075 在 Swift 字符串字面量不生效）
# - e1/e2: ShortcutsTool.swift 中 /usr/bin/shortcuts 被误判为 URI（实为文件系统路径）
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=**/ShortcutsTool.swift
sonar.issue.ignore.multicriteria.e2.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/AetherSDK/AetherConfig.swift

# 质量门：等待 SonarCloud 返回质量门结果（用于 PR 状态检查）
# 临时设为 false：Xcode 26.3 的 xccov 无法读取 xcresult 文件（FB0000000），
# 导致覆盖率数据为空，SonarCloud new_coverage 永远不达标
#
# 替代方案（当前生效）：
# - CI 的 `Post SonarCloud report to PR` 步骤通过 scripts/sonar-pr-comment.py
#   异步轮询质量门状态并将结果作为评论发布到 PR
# - Reviewer 根据评论中的 Quality Gate 状态与覆盖率数据手动审核
#
# 恢复条件（任一满足即可恢复为 true）：
# 1. Apple 修复 xccov 在 Xcode 26.3+ 上的 FB0000000 问题
# 2. CI 切换到 `xcrun xcresulttool get --legacy` 提取覆盖率（已弃用但可用）
# 3. CI 启用 sonar.coverage.exclusions 严格排除无覆盖数据文件，使 new_coverage 不再触发
sonar.qualitygate.wait=false
