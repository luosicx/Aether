# SonarCloud 项目配置

sonar.projectKey=luosicx_Aether
sonar.organization=luosicx
sonar.projectName=Aether

# 源码与测试目录
sonar.sources=Aether
sonar.tests=AetherTests,AetherUITests

# 排除纯 SwiftUI 视图、设计令牌、App 入口、协议定义、Actor 占位和 AetherWatch
# AetherUITests 不参与覆盖率统计（0% 覆盖的 UI 测试代码）
sonar.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**

# 覆盖率排除同上
# TerminalCommandTool.swift: 完全被 #if os(macOS) 包裹，iOS 测试不编译该文件，
# coverage.xml（来自 iOS unit-tests job）无法包含其覆盖数据；其测试在
# security-tests-macos job 独立运行，不生成 coverage.xml。排除避免误判为 0% 覆盖。
# SafariControlTool/FileOperationTool/WindowManagementTool: 同为 macOS-only 工具，
# iOS 测试不编译，其测试在 security-tests/security-tests-macos job 运行，不生成 coverage.xml。
sonar.coverage.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**,**/Services/Tools/TerminalCommandTool.swift,**/Services/Tools/SafariControlTool.swift,**/Services/Tools/FileOperationTool.swift,**/Services/Tools/WindowManagementTool.swift

# 覆盖率报告路径（CI 中由 xccov view --report 解析生成 SonarCloud Generic Coverage XML）
# 路径相对于项目根目录（如 Aether/Services/MyService.swift）
sonar.coverageReportPaths=coverage-report/coverage.xml

# 编码
sonar.sourceEncoding=UTF-8

# 质量门：等待 SonarCloud 返回质量门结果（用于 PR 状态检查）
sonar.qualitygate.wait=true
