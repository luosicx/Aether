# SonarCloud 项目配置
# 详见 doc/plans/sonarcloud-setup-guide.md

sonar.projectKey=luosicx_Aether
sonar.organization=luosicx
sonar.projectName=Aether

# 源码与测试目录
sonar.sources=Aether
sonar.tests=AetherTests,AetherUITests

# 排除纯 SwiftUI 视图、设计令牌、App 入口、协议定义、Actor 占位和 AetherWatch
# AetherUITests 不参与覆盖率统计（0% 覆盖的 UI 测试代码）
sonar.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**

# 覆盖率排除同上
sonar.coverage.exclusions=**/Views/**,**/DesignSystem/**,**/App/AetherApp.swift,**/Protocols/**,**/Actors/**,**/AetherWatch/**,**/AetherUITests/**

# 覆盖率报告路径（CI 中由 xccov view --report 解析生成 cobertura.xml）
# 使用 sonar.coverageReportPaths（通用属性）而非 sonar.swift.coverageReportPaths
# SonarCloud scanner 会通过 Coverage Report Importer 传感器导入此报告
sonar.coverageReportPaths=coverage-report/cobertura.xml

# 编码
sonar.sourceEncoding=UTF-8

# 质量门：等待 SonarCloud 返回质量门结果（用于 PR 状态检查）
sonar.qualitygate.wait=true
