# SonarCloud 项目配置
# 详见 doc/plans/sonarcloud-setup-guide.md

sonar.projectKey=luosicx_Aether
sonar.organization=luosicx
sonar.projectName=Aether

# 源码与测试目录
sonar.sources=Aether
sonar.tests=AetherTests,AetherUITests

# 排除 Views 和 DesignSystem（纯 SwiftUI 声明，不参与静态分析）
sonar.exclusions=**/Views/**,**/DesignSystem/**

# 覆盖率排除同上
sonar.coverage.exclusions=**/Views/**,**/DesignSystem/**

# 覆盖率报告路径（CI 中由 xccov-to-cobertura 生成）
sonar.swift.coverageReportPaths=coverage-report/cobertura.xml

# 编码
sonar.sourceEncoding=UTF-8

# 质量门：等待 SonarCloud 返回质量门结果（用于 PR 状态检查）
sonar.qualitygate.wait=true
