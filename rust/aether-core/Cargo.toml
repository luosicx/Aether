[package]
name = "aether-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "aether_core"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
sha2 = { workspace = true }

# candle 推理：排除 wasm32（Workers 无推理）和 android（fullfp16 编译问题，后续里程碑处理）
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

# wasmtime 沙箱：排除 wasm32（不支持）、iOS（不支持）、Android（后续里程碑）
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
wasmtime = { workspace = true }

# WAT 文本 → WASM 字节码（仅测试用，生产插件应为已编译的 .wasm）
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wat = "1"
