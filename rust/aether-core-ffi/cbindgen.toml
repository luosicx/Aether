language = "C"
header = "/* Auto-generated by cbindgen. Do not edit. */"
include_guard = "AETHER_CORE_FFI_H"
autogen_warning = "/* Warning: 本文件由 cbindgen 生成。 */"

# 头文件用于 host target（Apple/Android）。
# 映射 target_arch=wasm32 到标准宏 __wasm32__，使 cfg(not(target_arch = "wasm32"))
# 生成 `#if !defined(__wasm32__)`：host target 上该宏未定义 → 条件为真 → 沙箱绑定被包含。
[defines]
"target_arch = wasm32" = "__wasm32__"

[parse]
parse_deps = false
[fn]
prefix = "AETHER_EXPORT"
