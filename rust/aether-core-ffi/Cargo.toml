[package]
name = "aether-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# 禁用 wasm-opt：避免 wasm-pack 在沙箱/离线环境下从 GitHub 下载 binaryen 失败。
# 体积优化交由 Cloudflare Workers 部署管线处理（如需要可在 CI 单独启用）。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "aether_core_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aether-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# host target 依赖：candle 推理（排除 wasm32 和 android）
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

# wasmtime 沙箱：排除 wasm32、iOS、Android
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
wasmtime = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
