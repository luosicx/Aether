name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Configure simulator language
        run: |
          # Boot and shutdown to ensure data directory exists
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl shutdown "iPhone 17" 2>/dev/null || true
          # Find the simulator UDID
          UDID=$(xcrun simctl list devices -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == 'iPhone 17' and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          SIM_DOMAIN="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Preferences/.GlobalPreferences"
          defaults delete "$SIM_DOMAIN" AppleLanguages 2>/dev/null || true
          defaults write "$SIM_DOMAIN" AppleLanguages -array "zh-Hans"
          defaults delete "$SIM_DOMAIN" AppleLocale 2>/dev/null || true
          defaults write "$SIM_DOMAIN" AppleLocale -string "zh_Hans_CN"
          echo "Simulator language set to zh-Hans (UDID: $UDID)"

      - name: Build
        run: |
          xcodebuild build \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (UT only)
        run: |
          xcodebuild test \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -skip-testing:AetherUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          if-no-files-found: warn
