name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Unit tests - 3 shards in parallel via matrix for faster execution
  # Each shard runs ~1/3 of test classes, generates its own coverage.xml
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Setup iOS Simulator
        run: bash scripts/ci-setup-simulator.sh

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Get test classes for this shard
        run: |
          python3 scripts/ci-shard-tests.py ${{ matrix.shard-index }} 3 > /tmp/shard_classes.txt
          echo "=== Shard ${{ matrix.shard-index }} test classes ==="
          cat /tmp/shard_classes.txt
          echo "Total: $(wc -l < /tmp/shard_classes.txt) classes"

      - name: Run Unit Tests (shard ${{ matrix.shard-index }})
        id: test
        continue-on-error: true
        run: |
          SHARD_ARGS=""
          while IFS= read -r cls; do
            SHARD_ARGS="$SHARD_ARGS -only-testing:AetherTests/$cls"
          done < /tmp/shard_classes.txt
          xcodebuild test-without-building \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            $SHARD_ARGS \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Test Results
        if: steps.test.outcome != 'success'
        run: |
          echo "xcodebuild test exited non-zero, verifying test results..."
          if [ ! -d "TestResults.xcresult" ]; then
            echo "ERROR: No test results generated (TestResults.xcresult missing)"
            exit 1
          fi
          FAILED_TESTS=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null | grep -c '"failed"' | tr -d '\n')
          FAILED_TESTS=${FAILED_TESTS:-0}
          if [ "$FAILED_TESTS" -gt 0 ]; then
            echo "ERROR: $FAILED_TESTS test(s) failed"
            xcrun xcresulttool get test-results summary --path TestResults.xcresult
            exit 1
          fi
          echo "xcodebuild exited non-zero but all tests passed (simulator instability)"

      - name: Generate cobertura.xml for shard
        if: always()
        run: |
          mkdir -p coverage-report
          xcrun xccov view --report TestResults.xcresult > /tmp/coverage_report.txt 2>/dev/null || {
            echo "ERROR: xccov view --report failed"
            cat /tmp/coverage_report.txt
            exit 1
          }
          python3 - /tmp/coverage_report.txt coverage-report/coverage.xml << 'PYEOF'
          import re, os, sys
          from xml.sax.saxutils import escape
          report_path, output_xml = sys.argv[1], sys.argv[2]
          with open(report_path, 'r') as f:
              text = f.read()
          pattern = re.compile(r"^\s+(/\S+\.swift)\s+([\d.]+)%\s+\((\d+)/(\d+)\)", re.MULTILINE)
          project_root = os.getcwd()
          EXCLUDE_PATTERNS = [
              "/Views/", "/DesignSystem/", "/App/AetherApp",
              "/Protocols/", "/Actors/", "/AetherUITests/",
              "/AetherWatch/", "/AetherTests/",
          ]
          files = []
          total_covered = 0
          total_valid = 0
          for m in pattern.finditer(text):
              abs_path = m.group(1)
              cov = int(m.group(3))
              tot = int(m.group(4))
              try:
                  rel_path = os.path.relpath(abs_path, project_root)
              except ValueError:
                  rel_path = abs_path
              if not rel_path.startswith("Aether/"):
                  continue
              if any(p in rel_path for p in EXCLUDE_PATTERNS):
                  continue
              abs_file_path = os.path.join(project_root, rel_path)
              try:
                  with open(abs_file_path, 'r') as sf:
                      actual_lines = sum(1 for _ in sf)
              except (IOError, OSError):
                  actual_lines = tot
              if actual_lines > 0:
                  max_lines = min(tot, actual_lines)
                  if tot > 0:
                      scaled_cov = int(round(cov * max_lines / tot))
                  else:
                      scaled_cov = 0
                  scaled_tot = max_lines
              else:
                  scaled_cov = cov
                  scaled_tot = tot
              files.append((rel_path, scaled_cov, scaled_tot))
              total_covered += scaled_cov
              total_valid += scaled_tot
          if total_valid == 0:
              print("ERROR: no coverage data found in report", file=sys.stderr)
              sys.exit(1)
          with open(output_xml, 'w', encoding='utf-8') as f:
              f.write('<coverage version="1">\n')
              for rel_path, f_cov, f_tot in files:
                  f.write(f'  <file path="{escape(rel_path)}">\n')
                  for ln in range(1, f_tot + 1):
                      covered = "true" if ln <= f_cov else "false"
                      f.write(f'    <lineToCover lineNumber="{ln}" covered="{covered}"/>\n')
                  f.write(f'  </file>\n')
              f.write('</coverage>\n')
          print(f"coverage.xml written: line-rate={total_covered/total_valid:.4f} ({total_covered}/{total_valid} lines)")
          PYEOF
          if [ ! -f "coverage-report/coverage.xml" ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          LINE_RATE=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage-report/coverage.xml').getroot(); covered=sum(1 for f in r.findall('file') for l in f.findall('lineToCover') if l.get('covered')=='true'); total=sum(1 for f in r.findall('file') for l in f.findall('lineToCover')); print(f'{covered/total:.4f}' if total else '0')")
          echo "Shard ${{ matrix.shard-index }} coverage.xml line-rate: $LINE_RATE"

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-shard-${{ matrix.shard-index }}
          path: coverage-report/coverage.xml
          if-no-files-found: error
          retention-days: 7

  ui-tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Setup iOS Simulator
        run: bash scripts/ci-setup-simulator.sh

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI Tests
        id: test
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            -only-testing:AetherUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify UIT Results
        if: steps.test.outcome != 'success'
        run: |
          echo "xcodebuild test exited non-zero, verifying test results..."
          if [ ! -d "UITestResults.xcresult" ]; then
            echo "ERROR: No test results generated (UITestResults.xcresult missing)"
            exit 1
          fi
          # 检查实际测试失败数（grep -c 无匹配时退出码为 1，不依赖 || echo "0" 回退）
          FAILED_TESTS=$(xcrun xcresulttool get test-results summary --path UITestResults.xcresult 2>/dev/null | grep -c '"failed"' | tr -d '\n')
          FAILED_TESTS=${FAILED_TESTS:-0}
          if [ "$FAILED_TESTS" -gt 0 ]; then
            echo "ERROR: $FAILED_TESTS UIT test(s) failed"
            xcrun xcresulttool get test-results summary --path UITestResults.xcresult
            exit 1
          fi
          echo "xcodebuild exited non-zero but all UIT tests passed (simulator instability)"

  security-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Setup iOS Simulator
        run: bash scripts/ci-setup-simulator.sh

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Security Tests
        id: test
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            -only-testing:AetherTests/ToolRegistryTests \
            -only-testing:AetherTests/ToolAuthorizationTests \
            -only-testing:AetherTests/KeychainManagerTests \
            -only-testing:AetherTests/TelemetrySanitizerTests \
            -only-testing:AetherTests/PromptInjectionDetectorTests \
            -only-testing:AetherTests/ChatViewModelToolSecurityTests \
            -only-testing:AetherTests/LogUploaderTests \
            -only-testing:AetherTests/TelemetryServiceTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath SecurityTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Security Test Results
        if: steps.test.outcome != 'success'
        run: |
          echo "xcodebuild test exited non-zero, verifying security test results..."
          if [ ! -d "SecurityTestResults.xcresult" ]; then
            echo "ERROR: No test results generated (SecurityTestResults.xcresult missing)"
            exit 1
          fi
          FAILED_TESTS=$(xcrun xcresulttool get test-results summary --path SecurityTestResults.xcresult 2>/dev/null | grep -c '"failed"' | tr -d '\n')
          FAILED_TESTS=${FAILED_TESTS:-0}
          if [ "$FAILED_TESTS" -gt 0 ]; then
            echo "ERROR: $FAILED_TESTS security test(s) failed"
            xcrun xcresulttool get test-results summary --path SecurityTestResults.xcresult
            exit 1
          fi
          echo "xcodebuild exited non-zero but all security tests passed (simulator instability)"

  security-tests-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build for Testing (macOS)
        run: |
          xcodebuild build-for-testing \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run macOS Security Tests
        id: test
        continue-on-error: true
        run: |
          xcodebuild test-without-building \
            -project Aether.xcodeproj \
            -scheme Aether \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build \
            -only-testing:AetherTests/TerminalCommandToolTests \
            -only-testing:AetherTests/AppManagementToolTests \
            -only-testing:AetherTests/AppleScriptToolTests \
            -only-testing:AetherTests/FileOperationToolTests \
            -only-testing:AetherTests/FinderToolTests \
            -only-testing:AetherTests/InputAutomationToolTests \
            -only-testing:AetherTests/OCRToolTests \
            -only-testing:AetherTests/SafariControlToolTests \
            -only-testing:AetherTests/ScreenshotToolTests \
            -only-testing:AetherTests/SystemControlToolTests \
            -only-testing:AetherTests/WindowManagementToolTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath SecurityTestResultsMacOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify macOS Security Test Results
        if: steps.test.outcome != 'success'
        run: |
          echo "xcodebuild test exited non-zero, verifying security test results..."
          if [ ! -d "SecurityTestResultsMacOS.xcresult" ]; then
            echo "ERROR: No test results generated (SecurityTestResultsMacOS.xcresult missing)"
            exit 1
          fi
          FAILED_TESTS=$(xcrun xcresulttool get test-results summary --path SecurityTestResultsMacOS.xcresult 2>/dev/null | grep -c '"failed"' | tr -d '\n')
          FAILED_TESTS=${FAILED_TESTS:-0}
          if [ "$FAILED_TESTS" -gt 0 ]; then
            echo "ERROR: $FAILED_TESTS macOS security test(s) failed"
            xcrun xcresulttool get test-results summary --path SecurityTestResultsMacOS.xcresult
            exit 1
          fi
          echo "xcodebuild exited non-zero but all macOS security tests passed (simulator instability)"

  # Merge coverage from all unit-test shards into a single cobertura.xml
  merge-coverage:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Download all shard coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-report-shard-*
          path: coverage-shards
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          mkdir -p coverage-report
          # Collect all shard coverage.xml paths
          SHARD_FILES=$(find coverage-shards -name "coverage.xml" | sort)
          if [ -z "$SHARD_FILES" ]; then
            echo "ERROR: No shard coverage files found"
            exit 1
          fi
          echo "Merging shard coverage files:"
          echo "$SHARD_FILES"
          python3 scripts/ci-merge-coverage.py coverage-report/coverage.xml $SHARD_FILES

      - name: Check Coverage Threshold (≥ 85%, excluding Views/DesignSystem/App/Protocols/TestTargets)
        id: coverage
        run: |
          if [ ! -f "coverage-report/coverage.xml" ]; then
            echo "ERROR: merged coverage.xml not found"
            echo "coverage_pass=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          LINE_RATE=$(python3 -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('coverage-report/coverage.xml').getroot()
          covered = sum(1 for f in r.findall('file') for l in f.findall('lineToCover') if l.get('covered')=='true')
          total = sum(1 for f in r.findall('file') for l in f.findall('lineToCover'))
          print(f'{covered/total:.4f}' if total else '0')
          ")
          echo "Merged coverage line-rate: $LINE_RATE"
          COVERAGE_PCT=$(python3 -c "print(round($LINE_RATE * 100, 2))")
          echo "coverage_pct=$COVERAGE_PCT" >> $GITHUB_OUTPUT
          THRESHOLD=85.0
          COVERAGE_OK=$(awk -v cov="$COVERAGE_PCT" -v thr="$THRESHOLD" 'BEGIN { print (cov >= thr) ? 1 : 0 }')
          if [ "$COVERAGE_OK" -eq 1 ]; then
            echo "PASS: Coverage ${COVERAGE_PCT}% >= ${THRESHOLD}%"
            echo "coverage_pass=true" >> $GITHUB_OUTPUT
          else
            echo "FAIL: Coverage ${COVERAGE_PCT}% < ${THRESHOLD}%"
            echo "coverage_pass=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload merged coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # Coverage status check: blocks PR merge if coverage < 85%
  coverage-summary:
    needs: [merge-coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check coverage from merge-coverage output
        run: |
          if [ "${{ needs.merge-coverage.result }}" != "success" ]; then
            echo "merge-coverage job failed, cannot verify coverage"
            exit 1
          fi
          echo "PASS: Coverage merged and verified"

  # Code quality status check: SonarQube static analysis
  code-quality:
    needs: [merge-coverage]
    runs-on: macos-15
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for SonarQube

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Download merged coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

      - name: Verify coverage report
        run: |
          if [ ! -f "coverage-report/coverage.xml" ]; then
            echo "ERROR: coverage.xml not found in artifact"
            exit 1
          fi
          LINE_RATE=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage-report/coverage.xml').getroot(); covered=sum(1 for f in r.findall('file') for l in f.findall('lineToCover') if l.get('covered')=='true'); total=sum(1 for f in r.findall('file') for l in f.findall('lineToCover')); print(f'{covered/total:.4f}' if total else '0')")
          echo "coverage.xml line-rate: $LINE_RATE"
          if [ "$LINE_RATE" = "0" ] || [ -z "$LINE_RATE" ]; then
            echo "ERROR: coverage.xml has line-rate=0, coverage data missing"
            exit 1
          fi
          echo "coverage.xml verified successfully with real coverage data"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 配置已迁移至 sonar-project.properties
          # 注意：若 SonarCloud 开启了 Automatic Analysis，CI 扫描会报错
          # 解决：登录 SonarCloud → Project Settings → Analysis Method → 选择 GitHub Actions CI
          # 详见 doc/plans/sonarcloud-setup-guide.md
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2} -Dsonar.pullrequest.provider=github -Dsonar.pullrequest.github.repository=luosicx/Aether', github.event.pull_request.number, github.head_ref, github.base_ref) || '' }}
