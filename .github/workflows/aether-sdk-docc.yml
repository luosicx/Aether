# AetherSDK DocC Documentation Generation
#
# This workflow generates DocC documentation for the AetherSDK target
# and publishes it to GitHub Pages.
#
# 启用条件：
# 1. 仓库 Settings → Pages → Source 设为 GitHub Actions
# 2. 确保 Packages/AetherCore/Sources/AetherSDK/ 下源码有 /// 文档注释
#
# 触发条件：
#   - push 到 main 且 AetherSDK 源码或本 workflow 文件变更
#   - workflow_dispatch 手动触发

name: AetherSDK DocC

on:
  push:
    branches: [main]
    paths:
      - 'Packages/AetherCore/Sources/AetherSDK/**'
      - '.github/workflows/aether-sdk-docc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支的 DocC 构建串行执行，避免并发上传 Pages 资源冲突
concurrency:
  group: docc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docc:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-docc-${{ hashFiles('Packages/AetherCore/Package.resolved') }}

      - name: Generate DocC Documentation
        # Generates DocC documentation for the AetherSDK target.
        # Output goes to .build/docc/AetherSDK.doccarchive
        run: |
          cd Packages/AetherCore
          swift package \
            --allow-writing-to-directory .build/docc \
            generate-documentation \
            --target AetherSDK \
            --output-path .build/docc/AetherSDK.doccarchive \
            --emit-warning # emit warnings for missing docs; fail CI on warnings

      - name: Convert DocC Archive to Static Site
        # Convert .doccarchive to static HTML for GitHub Pages
        # hosting-base-path 需与仓库名一致（AIBuiler），部署后 URL 为
        # https://luosicx.github.io/AIBuiler/aether-sdk-docs/
        run: |
          cd Packages/AetherCore
          mkdir -p .build/docc-html
          $(xcrun --find docc) process-archive \
            transform-for-static-hosting \
            .build/docc/AetherSDK.doccarchive \
            --output-path .build/docc-html \
            --hosting-base-path AIBuiler/aether-sdk-docs

      - name: Upload DocC Archive Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-sdk-doccarchive
          path: Packages/AetherCore/.build/docc/AetherSDK.doccarchive

      - name: Upload Static Site Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-sdk-docc-html
          path: Packages/AetherCore/.build/docc-html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: aether-sdk-docc-html
