name: Release

# 触发条件：推送 v* 形式的 tag（如 v1.0.0），或 Actions 页面手动触发
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（如 1.0.0，无需 v 前缀）'
        required: true
        default: '1.0.0'

# 顶层权限：仅写入 Release 资源；内容只读
permissions:
  contents: write

# 全局并发：同一 tag 只允许一个发布流程
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 解析版本号，便于后续 job 引用
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION} (tag: v${VERSION})"

      - name: Determine prerelease status
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha)[0-9]* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # Rust Apple xcframework：构建 iOS/macOS 共用的 Rust 静态库
  # build-ios / build-macos 依赖此产物
  # ============================================================
  rust-apple:
    name: Apple xcframework
    needs: meta
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # x86_64-apple-ios-sim 在 stable channel 不可用；macos-15 runner 为 arm64，
          # iOS Simulator 仅需 aarch64-apple-ios-sim；macOS 需 x86_64-apple-darwin 支持 Intel Mac
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: apple-xcframework-release

      - name: Build static libs
        working-directory: rust
        run: |
          cargo rustc -p aether-core-ffi --release --target aarch64-apple-ios --crate-type staticlib
          cargo rustc -p aether-core-ffi --release --target aarch64-apple-ios-sim --crate-type staticlib
          cargo rustc -p aether-core-ffi --release --target aarch64-apple-darwin --crate-type staticlib
          cargo rustc -p aether-core-ffi --release --target x86_64-apple-darwin --crate-type staticlib

      - name: Create universal macOS library
        # xcframework 不允许为同一平台分别传入 arm64/x86_64 slice，
        # 需先用 lipo 合并为 universal binary 再传入。
        run: |
          mkdir -p rust/target/universal-apple-darwin/release
          lipo -create \
            rust/target/aarch64-apple-darwin/release/libaether_core_ffi.a \
            rust/target/x86_64-apple-darwin/release/libaether_core_ffi.a \
            -output rust/target/universal-apple-darwin/release/libaether_core_ffi.a
          lipo -info rust/target/universal-apple-darwin/release/libaether_core_ffi.a

      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -library rust/target/aarch64-apple-ios/release/libaether_core_ffi.a \
            -headers Packages/AetherCore/Sources/AetherRust/include \
            -library rust/target/aarch64-apple-ios-sim/release/libaether_core_ffi.a \
            -headers Packages/AetherCore/Sources/AetherRust/include \
            -library rust/target/universal-apple-darwin/release/libaether_core_ffi.a \
            -headers Packages/AetherCore/Sources/AetherRust/include \
            -output Packages/AetherCore/aether_core.xcframework

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-core-xcframework
          path: Packages/AetherCore
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # iOS: 构建 iOS Simulator .app（无签名，仅用于模拟器调试）
  # ============================================================
  build-ios:
    needs: [meta, rust-apple]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Download xcframework
        uses: actions/download-artifact@v7
        with:
          name: aether-core-xcframework
          path: Packages/AetherCore

      - name: Setup iOS Simulator
        run: bash scripts/ci-setup-simulator.sh

      - name: Build iOS .app (Release, simulator)
        run: |
          xcodebuild build \
            -project Aether.xcodeproj \
            -scheme Aether-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Locate and zip .app
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name 'Aether.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Aether.app not found"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --keepParent Aether.app "$GITHUB_WORKSPACE/Aether-iOS-${{ needs.meta.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-app
          path: Aether-iOS-${{ needs.meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # macOS: 使用 scripts/build-dmg.sh 产出 .dmg（根据 secrets 自动选择签名/未签名模式）
  # ============================================================
  build-macos:
    needs: [meta, rust-apple]
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      sign-mode: ${{ steps.sign-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Download xcframework
        uses: actions/download-artifact@v7
        with:
          name: aether-core-xcframework
          path: Packages/AetherCore

      - name: Determine signing mode
        id: sign-mode
        run: |
          if [ -n "${{ secrets.DEVELOPER_ID_APPLICATION }}" ] && \
             [ -n "${{ secrets.APPLE_ID }}" ] && \
             [ -n "${{ secrets.APP_SPECIFIC_PASSWORD }}" ] && \
             [ -n "${{ secrets.TEAM_ID }}" ]; then
            echo "mode=signed" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "mode=unsigned" >> $GITHUB_OUTPUT
            echo "suffix=-unsigned" >> $GITHUB_OUTPUT
          fi

      - name: Build and package DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          chmod +x scripts/build-dmg.sh
          if [ "${{ steps.sign-mode.outputs.mode }}" = "signed" ]; then
            ./scripts/build-dmg.sh --signed --notarize --app-version ${{ needs.meta.outputs.version }}
          else
            ./scripts/build-dmg.sh --unsigned --app-version ${{ needs.meta.outputs.version }}
          fi

      - name: Rename to canonical filename
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          SUFFIX="${{ steps.sign-mode.outputs.suffix }}"
          SRC=$(find build/dmg -maxdepth 1 -name "Aether-${VERSION}${SUFFIX}.dmg" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: dmg not found in build/dmg (expected Aether-${VERSION}${SUFFIX}.dmg)"
            ls -la build/dmg
            exit 1
          fi
          cp "$SRC" "Aether-macOS-${VERSION}${SUFFIX}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: Aether-macOS-${{ needs.meta.outputs.version }}${{ steps.sign-mode.outputs.suffix }}.dmg
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Android: 构建 Release APK（debug 签名，可直接安装）
  # ============================================================
  build-android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK and rename
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          cp "$APK" "Aether-Android-${{ needs.meta.outputs.version }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: Aether-Android-${{ needs.meta.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Windows: .NET 8 自包含发布包（win-x64，无需目标机安装 .NET）
  # ============================================================
  build-windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: windows/Aether.Windows
        run: dotnet restore

      - name: Publish self-contained (win-x64, Release)
        working-directory: windows/Aether.Windows
        run: |
          dotnet publish Aether.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o ../publish

      - name: Zip publish folder
        shell: pwsh
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          $source = "windows/publish"
          $dest = "Aether-Windows-${version}-x64.zip"
          if (-Not (Test-Path $source)) {
            Write-Error "publish folder not found: $source"
            exit 1
          }
          Compress-Archive -Path "$source/*" -DestinationPath $dest -CompressionLevel Optimal
          Write-Host "Created $dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: Aether-Windows-${{ needs.meta.outputs.version }}-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Cloudflare Workers BFF: 打包源码（部署由 wrangler 完成）
  # ============================================================
  build-bff:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        # D-1: Node.js 20 已于 2026-04-30 EOL，升级到 22 LTS（向后兼容）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: CloudflareWorkers
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund || true; fi

      - name: Run tests (best-effort)
        # M-C6: 原 `continue-on-error: true` + `|| true` 双重吞错，测试失败时 step 状态
        # 仍为 success，开发者无法从 CI 状态判断 BFF 测试是否通过。
        # 移除 `|| true`，保留 continue-on-error: true（发布流程不阻塞），
        # 让 step 状态正确反映测试结果，便于发布后追踪。
        working-directory: CloudflareWorkers
        continue-on-error: true
        run: npm test

      - name: Package BFF source
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          zip -r "Aether-BFF-${VERSION}.zip" CloudflareWorkers \
            -x "CloudflareWorkers/node_modules/*" \
            -x "CloudflareWorkers/.wrangler/*" \
            -x "CloudflareWorkers/.dev.vars"
          ls -lh "Aether-BFF-${VERSION}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bff-bundle
          path: Aether-BFF-${{ needs.meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 生成 Source Code 产物（可选，便于离线检视源码）
  # ============================================================
  build-source:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pack source tarball
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # 使用 git archive 打包 tag 指向的源码（不含 .git）
          git archive --format=tar.gz --prefix="Aether-${VERSION}/" HEAD -o "Aether-${VERSION}-source.tar.gz"
          git archive --format=zip   --prefix="Aether-${VERSION}/" HEAD -o "Aether-${VERSION}-source.zip"
          ls -lh "Aether-${VERSION}-source.tar.gz" "Aether-${VERSION}-source.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-archives
          path: |
            Aether-${{ needs.meta.outputs.version }}-source.tar.gz
            Aether-${{ needs.meta.outputs.version }}-source.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 发布：下载所有构建产物并创建 GitHub Release
  # ============================================================
  publish-release:
    needs: [meta, rust-apple, build-ios, build-macos, build-android, build-windows, build-bff, build-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect assets
        run: |
          echo "=== Downloaded release assets ==="
          ls -lh release-assets/

      - name: Generate SHA256 checksums
        run: |
          cd release-assets/
          for f in *; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          echo "Generated SHA256 files:"
          ls -lh *.sha256

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          NOTES=$(python3 scripts/extract-release-notes.py "$VERSION")
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Append unsigned notice
        if: needs.build-macos.outputs.sign-mode == 'unsigned'
        run: |
          echo "" >> /tmp/release-notes.md
          echo "⚠️ macOS DMG 未签名，首次打开需右键 → 打开绕过 Gatekeeper" >> /tmp/release-notes.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Aether v${{ needs.meta.outputs.version }}${{ needs.meta.outputs.is_prerelease == 'true' && ' (Pre-Release)' || '' }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease }}
          generate_release_notes: false
          files: |
            release-assets/Aether-iOS-${{ needs.meta.outputs.version }}.zip
            release-assets/Aether-macOS-*.dmg
            release-assets/Aether-Android-${{ needs.meta.outputs.version }}.apk
            release-assets/Aether-Windows-${{ needs.meta.outputs.version }}-x64.zip
            release-assets/Aether-BFF-${{ needs.meta.outputs.version }}.zip
            release-assets/Aether-${{ needs.meta.outputs.version }}-source.tar.gz
            release-assets/Aether-${{ needs.meta.outputs.version }}-source.zip
            release-assets/*.sha256
          fail_on_unmatched_files: false
